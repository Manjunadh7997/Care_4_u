<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Confirmed</title>
    <style>
        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f8fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container styling */
        .confirmation-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
        }

        /* Header styling */
        h1 {
            color: #3498db;
            font-size: 2em;
            margin-bottom: 20px;
        }

        /* Paragraph styling */
        p {
            color: #555;
            font-size: 1.1em;
            line-height: 1.5;
        }

        /* Add some space between paragraphs */
        p:not(:last-child) {
            margin-bottom: 10px;
        }

        /* Highlighting appointment details */
        .highlight {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h1>Your Appointment is Confirmed!</h1>
        <p>Thank you for booking an appointment with us, <span class="highlight">{{ name }}</span>.</p>
        <p>Your appointment with  <span class="highlight">{{ doctor }}</span> in the <span class="highlight">{{ department }}</span> department is scheduled for <span class="highlight">{{ date }}</span> at <span class="highlight">{{ time }}</span>.</p>
    </div>
</body>
</html>
